<style>
/* Layout: machine-control console. 3D work area fills the left, a DRO-style readout column on the right,
   transport bar along the bottom like a jog pendant. Stacks to one column on phones. */
:root {
  --bg: #eef1f3;          /* machine enamel, cool grey */
  --panel: #ffffff;
  --ink: #1b2329;
  --muted: #5d6b75;
  --line: #d3dade;
  --accent: #c76b00;      /* safety amber: the tool and the play control */
  --scene: #e3e8eb;
  --stock: #c9a679;       /* uncut stock top */
  --stock-cut: #6e4f2c;   /* deepest cut */
  --feed: #1f6fb2;
  --rapid: #d0342c;
  --ok: #2a7d46;
  --warn: #a86a00;
  --err: #c0322b;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191c; --panel: #1d2327; --ink: #e4e9ec; --muted: #93a1aa; --line: #2e373d;
  --accent: #f0962e; --scene: #11151a; --stock: #b8936a; --stock-cut: #5a3f22;
  --feed: #5aa7e6; --rapid: #ff6a5f; --ok: #5cc184; --warn: #e6a640; --err: #ff6a5f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191c; --panel: #1d2327; --ink: #e4e9ec; --muted: #93a1aa; --line: #2e373d;
  --accent: #f0962e; --scene: #11151a; --stock: #b8936a; --stock-cut: #5a3f22;
  --feed: #5aa7e6; --rapid: #ff6a5f; --ok: #5cc184; --warn: #e6a640; --err: #ff6a5f; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: .85rem; }
.verdict { font-family: var(--display); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
  padding: 2px 8px; border-radius: 3px; border: 1px solid currentColor; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--err); } .verdict.warn { color: var(--warn); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 10px; }
#stage { position: relative; min-height: 280px; background: var(--scene); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 10px; bottom: 8px; right: 230px; font-size: .75rem; color: var(--muted); pointer-events: none; }
#views { position: absolute; top: 8px; right: 8px; display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); }
#views button { font: 600 .75rem var(--display); letter-spacing: .05em; text-transform: uppercase; border: 0; border-left: 1px solid var(--line);
  background: none; color: var(--ink); padding: 5px 10px; cursor: pointer; }
#views button:first-child { border-left: 0; }
#views button.on { background: var(--accent); color: var(--panel); }
#views button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#legend { position: absolute; right: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  padding: 5px 8px; font-family: var(--mono); font-size: .7rem; color: var(--muted); pointer-events: none; }
#legend .lrow { display: flex; align-items: center; gap: 6px; }
#lbar { width: 110px; height: 9px; border-radius: 2px; }
#lstep { margin-top: 2px; text-align: center; }
aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.label { font-family: var(--display); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 6px; }
.dro { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dro b { font-weight: 600; color: var(--muted); }
.dro span { text-align: right; font-size: 1.1rem; }
.state { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-family: var(--mono); font-size: .8rem; }
.chip { padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.chip.change { background: var(--accent); color: var(--panel); border-color: var(--accent); }
#gline { font-family: var(--mono); font-size: .8rem; margin-top: 8px; white-space: nowrap; overflow-x: auto; color: var(--muted); }
#issues { flex: 1; min-height: 80px; overflow: auto; }
#issues ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#issues li button { all: unset; cursor: pointer; display: block; font-size: .82rem; line-height: 1.35; padding: 3px 6px; border-radius: 3px; border-left: 3px solid var(--err); }
#issues li.warning button { border-left-color: var(--warn); }
#issues li button:hover, #issues li button:focus-visible { background: var(--bg); outline: 1px solid var(--line); }
#issues .none { color: var(--ok); font-size: .85rem; }
.toggles { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; }
.transport button { font: 600 .85rem var(--display); letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.transport button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); min-width: 74px; }
.transport button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
.time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }
select { font: inherit; font-size: .85rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 4px; }
@media (max-width: 760px) {
  html, body { height: auto; }
  .hint { display: none; }
  main { grid-template-columns: minmax(0, 1fr); }
  #stage { height: 60vh; }
}

<header>
  <h1 id="title"></h1>
  <span class="sub" id="summary"></span>

</header>
<main>
  <div id="stage">
    <div id="views" role="group" aria-label="View">
      <button data-view="3d">3D</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button>
    </div>

  </div>
  <aside>
    <div class="box">
      <p class="label">Position (work coordinates, mm / deg)</p>
      <div class="dro">
        <b>X</b><span id="dx">0.000</span>
        <b>Y</b><span id="dy">0.000</span>
        <b>Z</b><span id="dz">0.000</span>

      <div id="gline"></div>

      <p class="label">Checks</p>

</main>
<div class="transport">
  <button class="primary" id="play">Play</button>
  <button id="restart">Restart</button>

  <label class="time" for="speed">Speed</label>

    <option value="200">200×</option><option value="1000">1000×</option>
  </select>
  <span class="time" id="clock">0:00 / 0:00</span>
</div>

const persp = new THREE.PerspectiveCamera(40, 1, 0.5, 20000);

const col = n => new THREE.Color(css(n));

// path: one LineSegments per kind, revealed with drawRange as the program plays
function pathPoint(p) {

  return [p[0], p[1] * Math.cos(a) - p[2] * Math.sin(a), p[1] * Math.sin(a) + p[2] * Math.cos(a)];

    const steps = rotary && a[3] !== b[3] ? Math.min(20000, Math.ceil(Math.abs(b[3] - a[3]) / 3)) : 1;
    for (let s = 0; s < steps; s++) {

      const q0 = a.map((v, k) => v + (b[k] - v) * t0), q1 = a.map((v, k) => v + (b[k] - v) * t1);

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const mat = kind === 1 ? new THREE.LineBasicMaterial({ color: col("--feed") })

  const line = new THREE.LineSegments(g, mat);

const feedLine = buildPath(1), rapidLine = buildPath(0);
function reveal(line, upto) {      // show segments whose move index < upto
  const idx = line.userData.moveIdx; let lo = 0, hi = idx.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (idx[mid] < upto) lo = mid + 1; else hi = mid; }
  line.geometry.setDrawRange(0, lo * 2);

// The stock is a grid of heights (box) or of radii per ray from the axis (rotary). Its size
// comes from a cell budget, so small parts get fine cells and big boards stay fast; only the
// rows the tool changed are redrawn.
const STOCK_CELLS = 800000, MIN_RES = 0.1;     // mm

    const len = S.x[1] - S.x[0], res = Math.max(MIN_RES, Math.sqrt(len * 2 * Math.PI * base / STOCK_CELLS));
    return { res, base, nx: Math.ceil(len / res) + 1, ny: Math.max(90, Math.min(2880, Math.ceil(2 * Math.PI * base / res))) };

  const w = S.x[1] - S.x[0], d = S.y[1] - S.y[0], res = Math.max(MIN_RES, Math.sqrt(w * d / STOCK_CELLS));

  g.setIndex(new THREE.BufferAttribute(stockIndex(nx, ny, grid.h, grid.floor, rotary), 1));
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nx * ny * 3), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(nx * ny * 3), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(nx * ny * 3), 3));
  stockMesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  stockMesh.frustumCulled = false;        // cuts go below the bounding sphere taken from the uncut block
  stockGroup.add(stockMesh);
  if (!rotary) {   // the block's sides as a faint box, open at the bottom so holes cut through show
    const side = new THREE.MeshLambertMaterial({ color: col("--stock"), transparent: true, opacity: 0.25, depthWrite: false });
    const none = new THREE.MeshBasicMaterial({ visible: false });
    const bx = new THREE.Mesh(new THREE.BoxGeometry(S.x[1] - S.x[0], S.y[1] - S.y[0], S.z[1] - S.z[0]),
      [side, side, side, side, none, none]);   // faces +x -x +y -y +z -z
    bx.position.set((S.x[0] + S.x[1]) / 2, (S.y[0] + S.y[1]) / 2, (S.z[0] + S.z[1]) / 2 - 0.05);

// through the whole block (all four corners at or below the stock bottom) gets degenerate
// triangles, so it shows as a hole and not as a floor. fillIndex redoes cell rows i0..i1.

function fillIndex(index, nx, ny, h, floor, wrap, i0, i1) {
  const cj = cellRow(ny, wrap), out = k => floor !== null && h[k] <= floor + 1e-6;
  for (let i = Math.max(0, i0); i <= Math.min(nx - 2, i1); i++) for (let j = 0; j < cj; j++) {
    const jn = (j + 1) % ny, a = i * ny + j, b = (i + 1) * ny + j, c = (i + 1) * ny + jn, d = i * ny + jn;
    const o = (i * cj + j) * 6;
    if (out(a) && out(b) && out(c) && out(d)) { index.fill(a, o, o + 6); continue; }

// program has been cut, then kept while scrubbing.
