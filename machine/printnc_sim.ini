# PROVISIONAL sim of the PrintNC V4 Metalcutter, matching machine/printnc_provisional.json.
# Travel 1035 x 1035 x 150 mm; home switches back/left/top, so Y homes at its maximum.
# Y is one joint here (the real machine has dual-Y with two joints).
# Velocities are the planned ~17 m/min rapid; accelerations are placeholders that only
# change how long the sim takes. Replace with the real INI once the machine runs.
# Use with printnc_sim.var (G54 offset) mounted as /work/machine.ini and /work/machine.var.

[EMC]
MACHINE = printnc-provisional-sim
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
OPEN_FILE = /work/program.ngc
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 50.0
MAX_LINEAR_VELOCITY = 283
GEOMETRY = XYZA
CYCLE_TIME = 0.100

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
SUBROUTINE_PATH = .

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
# -no_use_hal_manualtoolchange: tool changes complete instantly instead of popping a dialog
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange

[TRAJ]
COORDINATES = XYZA
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 283
DEFAULT_ANGULAR_VELOCITY = 360
MAX_ANGULAR_VELOCITY = 36000

[EMCIO]
# Without EMCIO = io, task never sees io finish E-stop reset and hangs there.
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
# No TOOL_CHANGE_POSITION: M6 then moved to machine 0,0,0, right on the X soft limit, and
# float rounding made LinuxCNC reject the next move. The post already retracts with
# G53 G0 Z0 before M6, and the real machine's M6 remap does its own moves.

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 1035
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = 0
MAX_LIMIT = 1035
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
HOME_SEQUENCE = 1

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 1035
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = 0
MAX_LIMIT = 1035
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
HOME = 1035
HOME_OFFSET = 1035
HOME_SEQUENCE = 1

[AXIS_Z]
MIN_LIMIT = -150
MAX_LIMIT = 0
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -150
MAX_LIMIT = 0
MAX_VELOCITY = 283
MAX_ACCELERATION = 2000
HOME = 0
HOME_OFFSET = 0
HOME_SEQUENCE = 0

[AXIS_A]
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000
[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000
HOME_SEQUENCE = 1
