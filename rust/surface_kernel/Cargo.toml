[package]
name = "camcore_surface_kernel"
version = "0.1.0"
edition = "2021"
description = "Drop-cutter and waterline on triangle meshes for camcore's 3-axis 3D operations"
publish = false

[lib]
name = "camcore_surface_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
