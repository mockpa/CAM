[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "camcore-surface-kernel"
version = "0.1.0"
description = "Drop-cutter and waterline on triangle meshes for camcore's 3-axis 3D operations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module"]
