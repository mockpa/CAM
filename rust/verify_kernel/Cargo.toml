[package]
name = "camcore_verify_kernel"
version = "0.1.0"
edition = "2021"
description = "Compiled inner loop of camcore.verify's stock model (heightmap and rotary radius map)"
publish = false

[lib]
name = "camcore_verify_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
