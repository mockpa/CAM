[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "camcore-verify-kernel"
version = "0.1.0"
description = "Compiled inner loop of camcore.verify's stock model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module"]
