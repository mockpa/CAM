# Simulated XYZA mill with tool changer, matching camcore's LinuxCNC post.
# Replace the [AXIS_*]/[JOINT_*] limits with your machine's values (copy them from
# your real INI) so soft-limit errors in the sim mean the same as on the machine.
# Travel and the G54 offset in sim.var match examples/machine.json.

[EMC]
MACHINE = camcore-sim
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
OPEN_FILE = /work/program.ngc
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 50.0
MAX_LINEAR_VELOCITY = 1000
GEOMETRY = XYZA
CYCLE_TIME = 0.100

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
SUBROUTINE_PATH = .

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
# -no_use_hal_manualtoolchange: tool changes complete instantly instead of popping a dialog
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange

[TRAJ]
COORDINATES = XYZA
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 1000
DEFAULT_ANGULAR_VELOCITY = 360
MAX_ANGULAR_VELOCITY = 36000

[EMCIO]
# Without EMCIO = io, task never sees io finish E-stop reset and hangs there.
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 600
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = 0
MAX_LIMIT = 600
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
HOME_SEQUENCE = 1

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 400
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = 0
MAX_LIMIT = 400
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
HOME_SEQUENCE = 1

[AXIS_Z]
MIN_LIMIT = -120
MAX_LIMIT = 0
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -120
MAX_LIMIT = 0
MAX_VELOCITY = 1000
MAX_ACCELERATION = 20000
HOME = 0
HOME_SEQUENCE = 0

[AXIS_A]
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000
[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000
HOME_SEQUENCE = 1
